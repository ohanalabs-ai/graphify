name: 🐳 vionix docker (graphify)
run-name: "🐳 graphify CLI image — ${{ github.event_name == 'pull_request' && format('PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.ref_name }}"

# OhanaLabs Vionix integration (not upstream). Builds the `graphify` CLI/runtime image — the base vionix-engram's
# worker + memoryworker build FROM — via the shared reusable ohanalabs-ai/github-platform docker-multiarch-cicd.yaml
# from the compose service `graphify` (ohanalabs/docker/graphify.Dockerfile):
#   PR → ghcr.io/ohanalabs-ai/graphify/graphify/pr/<n>:<sha7> (deleted on close) · merge/push to vionix/main →
#   ghcr.io/ohanalabs-ai/graphify/graphify:vionix-main-<sha7> (+ SBOM, SLSA provenance by the reusable).
# Path-filtered to the package + the OhanaLabs build inputs. GHCR only (no Docker Hub secret ever passes through
# job outputs — vionix-engram PR 24).

on:
  pull_request:
    branches: [vionix/main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".github/workflows/vionix-docker-graphify.yaml"
      - "graphify/**"
      - "pyproject.toml"
      - "ohanalabs/docker/graphify.Dockerfile"
      - "docker-compose.yaml"
      - ".dockerignore"
  push:
    branches: [vionix/main]
    paths:
      - ".github/workflows/vionix-docker-graphify.yaml"
      - "graphify/**"
      - "pyproject.toml"
      - "ohanalabs/docker/graphify.Dockerfile"
      - "docker-compose.yaml"
      - ".dockerignore"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Image platforms — linux/amd64 (default: the cluster's nodes; Macs run it through their Linux VM) or both, when an arm64 build is really needed"
        type: choice
        options: [linux/amd64, "linux/amd64,linux/arm64"]
        default: linux/amd64

jobs:
  docker-multiarch:
    name: 🐳 docker (graphify)
    uses: ohanalabs-ai/github-platform/.github/workflows/docker-multiarch-cicd.yaml@main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    with:
      registry: ghcr.io
      # amd64 ONLY by default (owner 2026-11-01: "don't waste resources on the mac version" — the clusters are amd64 and a
      # Mac runs the linux/amd64 image through its Linux VM). arm64 doubles the build: the extras (graspologic, lxml, grpcio,
      # psycopg, Pillow, …) compile under QEMU (~21 min). Dispatch with platforms=linux/amd64,linux/arm64 when one is needed.
      github-job-timeout-minutes: ${{ contains(inputs.platforms || 'linux/amd64', 'arm64') && 60 || 20 }}
      platforms: ${{ inputs.platforms || 'linux/amd64' }}
      docker-compose-target-service: graphify
      image-name-suffix: graphify
      docker-compose-file-name: docker-compose.yaml
      push-attestations: false
