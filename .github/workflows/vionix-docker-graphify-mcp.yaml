name: 🐳 vionix docker (graphify-mcp)
run-name: "🐳 graphify-mcp server image — ${{ github.event_name == 'pull_request' && format('PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.head.sha) || github.ref_name }}"

# OhanaLabs Vionix integration (not upstream). Builds the `graphify-mcp` image — the MCP query server
# (python -m graphify.serve, Streamable HTTP, multi-project via project_path) that Engram's engram-graphify-mcp runs —
# via the shared reusable ohanalabs-ai/github-platform docker-multiarch-cicd.yaml from the compose service
# `graphify-mcp` (ohanalabs/docker/graphify-mcp.Dockerfile):
#   PR → ghcr.io/ohanalabs-ai/graphify/graphify-mcp/pr/<n>:<sha7> · merge/push to vionix/main →
#   ghcr.io/ohanalabs-ai/graphify/graphify-mcp:vionix-main-<sha7> (+ SBOM, SLSA provenance by the reusable).

on:
  pull_request:
    branches: [vionix/main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".github/workflows/vionix-docker-graphify-mcp.yaml"
      - "graphify/**"
      - "pyproject.toml"
      - "ohanalabs/docker/graphify-mcp.Dockerfile"
      - "docker-compose.yaml"
      - ".dockerignore"
  push:
    branches: [vionix/main]
    paths:
      - ".github/workflows/vionix-docker-graphify-mcp.yaml"
      - "graphify/**"
      - "pyproject.toml"
      - "ohanalabs/docker/graphify-mcp.Dockerfile"
      - "docker-compose.yaml"
      - ".dockerignore"
  workflow_dispatch:

jobs:
  docker-multiarch:
    name: 🐳 docker (graphify-mcp)
    uses: ohanalabs-ai/github-platform/.github/workflows/docker-multiarch-cicd.yaml@main
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      pull-requests: write
    with:
      registry: ghcr.io
      # the mcp-only image took 9 min multi-arch on the first PR build — too close to the reusable's default 10
      github-job-timeout-minutes: 30
      platforms: linux/amd64,linux/arm64
      docker-compose-target-service: graphify-mcp
      image-name-suffix: graphify-mcp
      docker-compose-file-name: docker-compose.yaml
      push-attestations: false
